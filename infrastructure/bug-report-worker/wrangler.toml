name = "verp-bug-report"
main = "src/index.ts"
compatibility_date = "2026-08-21"
workers_dev = true

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[r2_buckets]]
binding = "SHOTS"
bucket_name = "verp-bug-report-shots"

[vars]
REPO_OWNER = "voss-labs"
REPO_NAME = "verp"
DAILY_LIMIT = "500"
MAX_BODY_BYTES = "3000000"
MAX_SCREENSHOT_BYTES = "1500000"
